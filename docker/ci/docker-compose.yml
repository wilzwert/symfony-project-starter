# See .env to set useful environment vars

services:

  app:
    extra_hosts:
      - "host.docker.internal=host-gateway"
    build:
      context: ../..
      dockerfile: docker/ci/frankenphp/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1001}
        APP_USER: ${APP_USER:-symfony}
    container_name: "${APP_NAME}-ci"
    restart: no

    user: root
    volumes:
      - ../../symfony:/app
      # Mounting docker socket is necessary to enable TestContainers to create containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_START_WITH_REQUEST=yes
      - XDEBUG_CONFIG=client_host=host.docker.internal